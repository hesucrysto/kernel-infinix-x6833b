name: Build snd-aloop for Infinix X6833B
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev crossbuild-essential-arm64

      - name: Build snd-aloop Module
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION=-android12-9-00016-g7c6bbcca33e1-ab12029497
          
          # Force the config into place manually
          cp arch/arm64/configs/defconfig .config
          
          # Bypass the broken Kconfig menus by only preparing headers
          make -j$(nproc) modules_prepare
          
          # Direct compilation of just the ALSA loopback driver
          # This avoids the broken drivers/scsi folder completely
          make -j$(nproc) M=sound/drivers CONFIG_SND_ALOOP=m modules
          
      - name: Organize Artifact
        run: |
          mkdir -p output
          find sound/drivers -name "snd-aloop.ko" -exec cp {} output/ \;

      - name: Upload Driver
        uses: actions/upload-artifact@v4
        with:
          name: infinix-snd-aloop
          path: output/snd-aloop.ko
